<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYMEET Step 2 — Tokens preview</title>
  <link rel="stylesheet" href="../kayan-theme/assets/css/tokens.css">
  <link rel="stylesheet" href="../kayan-theme/assets/css/typography.css">
  <link rel="stylesheet" href="../kayan-theme/components/styles/kymeet-app.css">
  <style>
    .demo { max-width: 390px; margin: 0 auto; padding: 16px; }
    .card { padding: 16px; margin-bottom: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; font-weight: 600; border: none; cursor: pointer; }
    .btn-pepsi { background: var(--pepsi-metal); color: #fff; border-radius: var(--radius-pill); box-shadow: var(--shadow-btn); }
    .chip { display: inline-block; padding: 8px 14px; border-radius: var(--radius-pill); border: 1px solid var(--border); margin: 4px; font-size: 13px; }
    .chip.on { background: var(--pepsi-500); color: #fff; border-color: transparent; }
  </style>
</head>
<body class="kymeet-app kayan-lang-ar">
  <div class="demo">
    <h1>KYMEET</h1>
    <p class="muted">Royal Metallic Blue على أبيض — Step 2</p>
    <div class="prod-card card">
      <h3>عطر تجريبي</h3>
      <p class="price">5,300 ج.م</p>
      <button type="button" class="btn btn-gold">اكتشف الآن</button>
    </div>
    <button type="button" class="btn btn-pepsi">زر Pepsi metal</button>
    <div style="margin-top:16px">
      <span class="chip on">الكل</span>
      <span class="chip">رجالي</span>
      <span class="chip">نسائي</span>
    </div>
  </div>
</body>
</html>
